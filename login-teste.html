<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MABELIS — Teste de login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#2e4052,#1d2936);font:15px Arial,sans-serif;color:#eef4ff;padding:20px}
main{width:min(460px,100%);border:1px solid #758394;border-radius:20px;padding:26px;background:#263647}
h1{color:#f2ce80;text-align:center;letter-spacing:3px;margin:4px 0 6px}h2{text-align:center;font-size:14px;font-weight:normal;margin:0 0 28px}
button{width:100%;padding:14px;border-radius:9px;border:1px solid white;background:#e8c887;font-weight:bold;cursor:pointer}
#out{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;margin-top:20px}
small{display:block;margin-top:20px;color:#c4d5e8}
</style>
</head>
<body><main><h1>MABELIS</h1><h2>CIVILIZAÇÃO — TESTE DE LOGIN</h2>
<p>Entre com sua conta Google para identificar o administrador.</p>
<button id="login">Entrar com Google</button>
<div id="out" role="status">Aguardando login.</div>
<small>Página temporária de teste. Não altera o jogo e não concede acesso administrativo automaticamente.</small>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
const firebaseConfig={
  apiKey:"AIzaSyABVeSs1KA16YXDsqhTJpJavyWF-K0NKeY",
  authDomain:"mabelis-civilizacao.firebaseapp.com",
  projectId:"mabelis-civilizacao",
  storageBucket:"mabelis-civilizacao.firebasestorage.app",
  messagingSenderId:"1077152274878",
  appId:"1:1077152274878:web:5277faf0224490d4fcc1ef"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const out=document.getElementById("out");
function show(user){
  out.textContent=user ? "Login realizado!\n\nNome: "+(user.displayName||"—")+"\nE-mail: "+(user.email||"—")+"\nUID: "+user.uid+"\n\nAgora abra Firebase → Authentication → Usuários para confirmar o cadastro." : "Aguardando login.";
}
onAuthStateChanged(auth,show,error=>out.textContent="Erro de autenticação: "+error.code+" — "+error.message);
document.getElementById("login").addEventListener("click",async()=>{
  out.textContent="Abrindo Google...";
  try{await signInWithPopup(auth,new GoogleAuthProvider());}
  catch(error){out.textContent="Não foi possível entrar: "+error.code+" — "+error.message;}
});
</script></body></html>
