ss="modal"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="mt"></h2><button onclick="closeModal()">✕</button></div><div id="mb"></div></div></div><script>

e','Multidisciplinar',{Economia:8,Sabedoria:8},18],['Civilização Suprema','Multidisciplinar',{Tecnologia:8,Sabedoria:7,Armamento:6},18]];const defs=[['Roubo',4,'Roube até 2 moedas.','steal'],['Investimento',4,'Receba 3 moedas.','invest'],['Crise Econômica',3,'Adversário perde até 3 moedas.','crisis'],['Imposto',3,'Receba até 1 moeda de cada adversário.','tax'],['Sabotagem Tecnológica',3,'Reduza Tecnologia de adversário em 1.','techdown'],['Ataque Militar',3,'Reduza Armamento de adversário em 1.','armdown'],['Crise Educacional',3,'Reduza Sabedoria de adversário em 1.','wisdown'],['Sabotagem Econômica',3,'Reduza Economia de adversário em 1.','ecodown'],['Descoberta Científica',2,'Aumente Tecnologia em 1.','techup'],['Treinamento Militar',2,'Aumente Armamento em 1.','armup'],['Revolução Intelectual',2,'Aumente Sabedoria em 1.','wisup'],['Crescimento Econômico',2,'Aumente Economia em 1.','ecoup'],['Domínio',2,'Tente dominar outra civilização.','dominate'],['Roubo de Carta',2,'Escolha carta virada para baixo do alvo.','cardsteal'],['Proteção',2,'Bloqueia ações hostis e domínio até seu próximo turno.','shield']];let S;const $=id=>document.getElementById(id),rand=n=>Math.floor(Math.random()*n),shuffle=a=>a.sort(()=>Math.random()-.5),p=()=>S.players[S.turn],limit=x=>x.a.Sabedoria<=5?3:x.a.Sabedoria<=10?4:5,dice=x=>x.a.Tecnologia<=5?4:x.a.Tecnologia<=10?5:6,income=x=>x.a.Economia<=5?1:x.a.Economia<=10?2:3,esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');function msg(s){S.log.unshift(s);S.log=S.log.slice(0,30)}function modal(t,b){$('mt').textContent=t;$('mb').innerHTML=b;$('overlay').classList.remove('hidden')}function closeModal(){$('overlay').classList.add('hidden')}function draw(){if(!S.deck.length&&S.discard.length){S.deck=shuffle(S.discard.splice(0))}return S.deck.pop()??null}function discard(c){if(c===undefined||c===null)return;S.discard.push(c)}function returnVoluntary(c){if(c===undefined||c===null)return;const pos=Math.floor(Math. (x)||(!S.deck.length&&!S.discard.length)?'disabled':'')+'>Comprar carta · 1 🪙</button>';return}el.innerHTML='<p>Compras restantes: '+S.remaining+'</p>'+aspects.map(a=>{let c=x.a[a]>=10?5:2;return '<button onclick="buyLevel(\''+a+'\')" '+(!S.remaining||x.a[a]>=12||x.coins<c?'disabled':'')+'>'+a+' +1 · '+c+' 🪙</button> '}).join('')}function rollDice(){if(S.winner||S.phase==='buy'||S.rolls>=3)return;let x=p();if(S.rolls){if(x.coins<4)return;x.coins-=4}S.rolls++;S.phase='buy';S.kind='';S.result=1+rand(dice(x));S.remaining=S.result;msg(x.name+' lançou D'+dice(x)+': '+S.result);render()}function buyCard(){let x=p();if(S.phase!=='buy'||S.kind!=='cards'||!S.remaining||x.coins<1||x.hand.length>=limit(x))return;let c=draw();if(c===null)return;x.hand.push(c);x.coins--;S.remaining--;msg(x.name+' comprou uma carta.');render()}function buyLevel(a){let x=p(),c=x.a[a]>=10?5:2;if(S.phase!=='buy'||S.kind!=='levels'||!S.remaining||x.a[a]>=12||x.coins<c)return;x.coins-=c;x.a[a]++;S.remaining--;msg(x.name+' elevou '+a+' para '+x.a[a]);render()}function finishBuy(){if(S.phase!=='buy')return;S.phase='after';render()}function endTurn(){if(S.winner||S.phase==='buy')return;let old=p();msg(old.name+' encerrou o turno.');S.turn=(S.turn+1)%S.players.length;if(!S.turn)S.round++;let x=p();x.shield=false;x.dom=false;x.trade=false;x.coins+=income(x);S.phase='pre';S.rolls=0;S.kind='';S.remaining=0;msg('Vez de '+x.name+' (+'+income(x)+' moeda(s)).');render();modal('Passe o celular','<p>Agora é a vez de <b>'+esc(x.name)+'</b>. Entregue o aparelho para manter as cartas secretas.</p><button class="green" onclick="closeModal()">Estou pronto</button>')}function showCard(i){let x=p(),id=x.hand[i],d=defs[id];modal(d[0],'<p>'+d[2]+'</p><p class="muted">'+(S.phase==='pre'?'Pode usar antes do dado.':'Só pode usar cartas antes do primeiro dado.')+'</p><button class="green" '+(S.phase!=='pre'||!!S.winner?'disabled':'')+' onclick="useCard('+i+')">Usar carta</button> <button class="danger" '+(!!S.winner?'disabled':'')+' onclick="discardChosen('+i+')">Descartar sem reembolso</button>')}function discardChosen(i){if(S.winner||!S||i<0||i>=p().hand.length)return;const x=p(),id=x.hand.splice(i,1)[0];returnVoluntary(id);msg(x.name+' descartou voluntariamente uma carta de ação.');closeModal();render()}function targets(){return S.players.map((x,i)=>({x,i})).filter(z=>z.i!==S.turn)}function chooseTarget(cb,filter=()=>true){let t=targets().filter(z=>filter(z.x));if(!t.length){modal('Sem alvo','<p>Nenhum adversário elegível.</p>');return}modal('Escolha o adversário',t.map(z=>'<div class="item"><button onclick="'+cb+'('+z.i+')">'+esc(z.x.name)+'</button> · Armamento '+z.x.a.Armamento+(z.x.shield?' 🛡️ protegido':'')+'</div>').join(''))}function useCard(i){let x=p();if(S.phase!=='pre'||x.hand[i]===undefined)return;let id=x.hand[i],type=defs[id][3];if(type==='dominate'){closeModal();chooseTarget('cardDom',y=>!y.shield&&x.a.Armamento>=y.a.Armamento+2);S.pending=i;return}if(type==='cardsteal'){closeModal();chooseTarget('cardTarget',y=>!y.shield&&y.hand.length>0);S.pending=i;return}if(['steal','crisis','techdown','armdown','wisdown','ecodown'].includes(type)){closeModal();chooseTarget('attackTarget',y=>!y.shield);S.pending=i;return}x.hand.splice(i,1);discard(id);if(type==='shield'){x.shield=true;msg(x.name+' ativou proteção.')}if(type==='invest'){x.coins+=3;msg(x.name+' recebeu 3 moedas.')}if(type==='tax'){let n=0;targets().forEach(z=>{if(!z.x.shield&&z.x.coins){z.x.coins--;x.coins++;n++}});msg(x.name+' cobrou '+n+' moeda(s) de imposto.')}let a={techup:'Tecnologia',armup:'Armamento',wisup:'Sabedoria',ecoup:'Economia'}[type];if(a){x.a[a]=Math.min(12,x.a[a]+1);msg(x.name+' evoluiu '+a)}closeModal();render()}function consumePending(){let i=S.pending,id=p().hand[i];if(S.phase!=='pre'||id===undefined)return false;p().hand.splice(i,1);discard(id);S.pending=null;return true}function trim(x){while(x.hand.length>limit(x))discard(x.hand.pop())}function attackTarget(i){let y=S.players[i],type=defs[p().hand[S.pending]][3];if(y.shield)return;consumePending();let n=0;if(type==='steal'){n=Math.min(2,y.coins);y.coins-=n;p().coins+=n}else if(type==='crisis'){n=Math.min(3,y.coins);y.coins-=n}else{let a={techdown:'Tecnologia',armdown:'Armamento',wisdown:'Sabedoria',ecodown:'Economia'}[type];n=Math.min(1,y.a[a]);y.a[a]-=n;if(a==='Sabedoria')trim(y)}msg(p().name+' usou '+type+' contra '+y.name+'.');closeModal();render()}function cardTarget(i){let y=S.players[i];if(y.shield||!y.hand.length)return;S.target=i;modal('Escolha uma carta de '+esc(y.name),'<p>As cartas estão viradas para baixo. Escolha uma posição:</p><div class="row">'+shuffle(y.hand.map((_,j)=>j)).map(j=>'<button class="back" onclick="takeCard('+j+')">🂠</button>').join('')+'</div>')}function takeCard(j){let y=S.players[S.target];if(!y||y.hand[j]===undefined||y.shield)return;consumePending();let c=y.hand.splice(j,1)[0];p().hand.push(c);msg(p().name+' roubou uma carta de '+y.name);closeModal();render();modal('Carta obtida','<p>'+esc(defs[c][0])+'</p><p>'+esc(defs[c][2])+'</p>')}function cardDom(i){if(!consumePending())return;resolveDom(i)}function resolveDom(i){let y=S.players[i],x=p();if(y.shield||x.a.Armamento<y.a.Armamento+2)return;S.target=i;modal('Domínio sobre '+esc(y.name),'<p>Escolha uma recompensa:</p><div class="row"><button onclick="domReward(\'coins\')">Até 5 moedas</button><button onclick="domReward(\'levels\')">Até 2 níveis</button><button onclick="domReward(\'cards\')">Até 2 cartas</button></div>')}function domReward(k){let x=p(),y=S.players[S.target];if(k==='coins'){let n=Math.min(5,y.coins);y.coins-=n;x.coins+=n}else if(k==='cards'){let n=Math.min(2,y.hand.length,limit(x)-x.hand.length);for(let j=0;j<n;j++)x.hand.push(y.hand.splice(rand(y.hand.length),1)[0])}else{modal('Reduzir até 2 níveis','<p>Escolha os aspectos do alvo:</p><div id="dlevels"></div><button onclick="closeModal();render()">Concluir</button>');S.domLeft=2;domLevels();x.dom=true;msg(x.name+' dominou '+y.name);render();return}x.dom=true;msg(x.name+' dominou '+y.name);closeModal();render()}function domLevels(){let y=S.players[S.target];$('dlevels').innerHTML='Restantes: '+S.domLeft+'<div class="row">'+aspects.map(a=>'<button '+(!S.domLeft||!y.a[a]?'disabled':'')+' onclick="domDown(\''+a+'\')">'+a+' ('+y.a[a]+')</button>').join('')+'</div>'}function domDown(a){let y=S.players[S.target];if(!S.domLeft||!y.a[a])return;y.a[a]--;S.domLeft--;if(a==='Sabedoria')trim(y);domLevels();save()}function objectives(){let x=p();modal('Meus objetivos · '+x.done.length+'/2',x.obj.map((id,j)=>{let o=raw[id],ok=Object.entries(o[2]).every(([a,n])=>x.a[a]>=n)&&x.coins>=o[3]&&(!o[4]||o[4]==='dom'&&x.dom||o[4]==='trade'&&x.trade);return '<div class="item"><b>'+esc(o[0])+'</b> · '+o[1]+' '+(x.done.includes(id)?'✅ CONCLUÍDO':'')+'<p>'+Object.entries(o[2]).map(([a,n])=>a+': '+x.a[a]+'/'+n).join(' · ')+' · Custo: '+o[3]+' moedas</p>'+(o[4]==='dom'?'<p>Dominar civilização com Armamento ao menos 2 níveis inferior, durante este turno.</p>':o[4]==='trade'?'<p>Realizar negociação voluntária de moedas neste turno.</p>':'')+(!x.done.includes(id)?'<button class="green" '+(!ok||!!S.winner?'disabled':'')+' onclick="claim('+id+')">Declarar objetivo</button>':'')+'</div>'}).join('')+'<p class="muted">Objetivos concluídos são permanentes; níveis não são consumidos.</p>')}function claim(id){let x=p(),o=raw[id];if(x.done.includes(id)||x.coins<o[3]||!Object.entries(o[2]).every(([a,n])=>x.a[a]>=n)||(o[4]==='dom'&&!x.dom)||(o[4]==='trade'&&!x.trade))return;x.coins-=o[3];x.done.push(id);msg(x.name+' concluiu '+o[0]);if(x.done.length===2){S.winner=x.name;msg('🏆 '+x.name+' venceu!')}render();objectives()}function opponents(){modal('Civilizações adversárias',targets().map(z=>'<div class="item"><b>'+esc(z.x.name)+'</b> '+(z.x.shield?'🛡️':'')+' · 🪙 '+z.x.coins+' · Objetivos '+z.x.done.length+'/2<p>'+aspects.map(a=>a+' '+z.x.a[a]).join(' · ')+'</p><p>Cartas na mão: '+z.x.hand.length+' (ocultas)</p><button onclick="trade('+z.i+')">Propor troca de moedas</button></div>').join(''))}function trade(i){let y=S.players[i],x=p();if(S.phase==='buy')return modal('Aguarde','<p>Encerre as compras antes de negociar.</p>');modal('Negociação voluntária','<p>Troca de 1 moeda de '+esc(x.name)+' por 1 moeda de '+esc(y.name)+'. Para objetivos comerciais, a negociação deve transferir valores diferentes; este protótipo permite oferecer 1 moeda em troca de 2.</p><button '+(x.coins<1||y.coins<2?'disabled':'')+' onclick="offerTrade('+i+')">Oferecer 1 por 2 moedas</button>')}function offerTrade(i){let y=S.players[i],x=p();modal('Confirmação de '+esc(y.name),'<p>Entregue o aparelho a '+esc(y.name)+'. Aceita dar 2 moedas e receber 1?</p><button onclick="acceptTrade('+i+')">Aceitar</button> <button onclick="closeModal()">Recusar</button>')}function acceptTrade(i){let y=S.players[i],x=p();if(x.coins<1||y.coins<2)return;y.coins-=2;y.coins++;x.coins--;x.coins+=2;x.trade=true;msg(x.name+' negociou moedas com '+y.name);closeModal();render()}function rules(){modal('Resumo das regras','<div class="item">2 a 6 jogadores. Cada um começa com 3 moedas, 1 carta de ação e 2 objetivos secretos de categorias diferentes. Conclua ambos para vencer. Declare durante seu turno e pague o custo; conquistas são permanentes.</div><div class="item">Início do turno: renda de Economia (0–5: 1; 6–10: 2; 11–12: 3). Use cartas ANTES do primeiro dado. Tecnologia 0–5: D4; 6–10: D5; 11–12: D6.</div><div class="item">Cada dado permite até o resultado em compras, escolhendo APENAS cartas (1 moeda cada, aleatórias) OU níveis (2 moedas até nível 10; 5 moedas nos níveis 11 e 12). Até 2 dados adicionais por turno, 4 moedas cada.</div><div class="item">Sabedoria 0–5: até 3 cartas; 6–10: 4; 11–12: 5. Se Sabedoria cair, descarte imediatamente as excedentes. Toque em uma carta para descartá-la voluntariamente, sem reembolso. Cartas compradas só podem ser usadas em turno posterior.</div><div class="item">Domínio: permitido com carta própria ou objetivo ativo; exige Armamento 2 níveis acima do alvo. Escolha até 5 moedas, até 2 níveis reduzidos ou até 2 cartas do alvo. Proteção bloqueia ações hostis e qualquer domínio até o próximo turno do protegido.</div><div class="item">O jogador pode descartar qualquer carta de sua mão durante seu turno, sem receber moedas de volta. Somente cartas descartadas voluntariamente voltam imediatamente a uma posição aleatória do baralho, sem serem reveladas. Cartas utilizadas e descartadas por redução de Sabedoria vão para a pilha de descarte; quando o baralho principal acabar, a pilha será embaralhada para formar um novo baralho. A mão dos adversários é secreta. Esta versão é uma demonstração local, sem salas online.</div>')}let saved=localStorage.getItem('mabelis-civilizacao-demo')||localStorage.getItem('novo-mundo-demo');try{if(saved){S=JSON.parse(saved);render()}else setup()}catch(e){localStorage.removeItem('novo-mundo-demo');setup()}
</script></body></html>
