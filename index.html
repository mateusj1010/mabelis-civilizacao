ion><section class="panel center"><div class="box" id="status"></div><div class="box" id="shop"></div><div class="civilizations" id="civilizations"></div></section><section class="panel side"><button onclick="objectives()">🎯 Meus objetivos <span id="progress"></span></button><button onclick="opponents()">👥 Adversários e acordos</button><button onclick="rules()">📖 Regras</button></section><section class="panel hand"><h3>🃏 Minhas cartas <span id="handcount"></span></h3><div class="cards" id="hand"></div></section><section class="panel dice"><div id="rollcount"></div><button class="green" id="roll" onclick="rollDice()">🎲 Jogar dado</button><button id="end" onclick="endTurn()">Finalizar turno</button></section></main><div id="overlay" class="overlay hidden"><div class="modal"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="mt"></h2><button onclick="closeModal()">✕</button></div><div id="mb"></div></div></div><script>

??null}function discard(c){if(c===undefined||c===null)return;S.discard.push(c)}function setup(){modal('Nova partida — demonstração local','<p>Demonstração local: os participantes jogam no mesmo aparelho, passando-o a cada turno. O modo online e as notificações privadas em dispositivos diferentes ainda não estão implementados.</p><label>Jogadores (2 a 6): <input id="names" style="width:100%" value="Ana, Bruno, Carla"></label><div class="row"><button class="green" onclick="start()">Iniciar partida</button></div>')}function start(){let names=$('names').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,6);if(names.length<2)return alert('Informe pelo menos dois nomes.');let pool=shuffle(raw.map((o,i)=>i));let players=names.map(name=>{let i=pool.pop(),j=pool.findIndex(k=>raw[k][1]!==raw[i][1]);let k=pool.splice(j,1)[0];return {name,coins:3,a:{Tecnologia:0,Armamento:0,Sabedoria:0,Economia:0},hand:[],obj:[i,k],done:[],shield:false,dom:false,trade:false}});S={players,turn:0,round:1,rolls:0,phase:'pre',remaining:0,kind:'',deck:shuffle(defs.flatMap((d,i)=>Array(d[1]).fill(i))),discard:[],log:[],winner:null,agreements:[],attackedThisTurn:[]};players.forEach(x=>x.hand.push(draw()));msg('Partida iniciada. '+p().name+' começa.');save();closeModal();render()}function save(){localStorage.setItem('mabelis-civilizacao-demo',JSON.stringify(S))}function render(){if(!S)return;let x=p();$('fortune').textContent='🪙 '+x.coins+' moedas';$('who').textContent='👤 '+x.name;$('round').textContent='Rodada '+S.round;$('shield').textContent=x.shield?'🛡️ Protegido':'';$('stats').innerHTML=aspects.map(a=>'<div class="stat"><b><span>'+a+'</span><span>'+x.a[a]+'/12</span></b><div class="bar"><i style="width:'+(x.a[a]/12*100)+'%"></i></div><span class="muted">'+(a==='Tecnologia'?'Dado D'+dice(x):a==='Sabedoria'?'Limite '+limit(x)+' cartas':a==='Economia'?'+'+income(x)+' moeda(s)/turno':'Domínio: +2 níveis sobre o alvo')+'</span></div>').join('');$('progress').textContent=x.done.length+'/2';$('handcount').textContent=x.hand.length+'/'+limit(x);$('hand').innerHTML=x.hand.map((id,i)=>'<button class="card" aria-label="Abrir carta '+esc(defs[id][0])+'" onclick="showCard('+i+')"><img src="'+actionImage(id)+'" alt=""></button>').join('')||'<span class="muted">Sem cartas</span>';$('status').innerHTML='<b>'+ (S.winner?'🏆 '+S.winner+' venceu!':S.phase==='pre'?'Sua vez: use cartas ou lance o dado.':S.phase==='buy'?'Resultado do dado: '+S.result+' · compras restantes: '+S.remaining:S.phase==='after'?'Compras encerradas. Novo lançamento ou fim do turno.':'Aguardando')+'</b><p class="muted">'+(S.phase==='pre'?'Cartas de ação só podem ser usadas antes do primeiro lançamento.':'Objetivos podem ser declarados durante sua vez.')+'</p>';$('rollcount').textContent='🎲 '+S.rolls+'/3 lançamentos · D'+dice(x);$('roll').textContent=S.rolls===0?'🎲 Jogar dado':'🎲 Novo dado · 4 🪙';$('roll').disabled=!!S.winner||S.phase==='buy'||S.rolls>=3||(S.rolls>0&&x.coins<4);$('end').disabled=!!S.winner;$('shop').innerHTML=S.phase==='buy'?'<b>Escolha uma categoria por lançamento</b><div class="row"><button '+(S.kind==='cards'?'':'')+' onclick="choose(\'cards\')" '+(S.kind==='levels'?'disabled':'')+'>🃏 Cartas</button><button onclick="choose(\'levels\')" '+(S.kind==='cards'?'disabled':'')+'>📈 Níveis</button></div><div id="purchase"></div><button onclick="finishBuy()">Encerrar compras deste dado</button>':'<span class="muted">'+(S.rolls?'Você pode declarar objetivos, comprar outro lançamento ou finalizar o turno.':'Utilize cartas antes de lançar o dado; consulte objetivos e adversários nos botões à direita.')+'</span>';if(S.phase==='buy')renderPurchase();renderCivilizations();save()}function renderCivilizations(){const el=$('civilizations');if(!el||!S)return;const current=S.players[S.turn];const city=(x,i,small)=>'<div class="city '+(small?'mini':'featured')+'"><div class="city-name">'+esc(x.name)+(i===S.turn?' · JOGANDO':'')+'</div><div class="city-art" aria-hidden="true"><span class="tower t1"></span><span class="tower t2"></span><span class="tower t3"></span><span class="tower t4"></span><span class="tower t5"></span></div><div class="city-levels">'+aspects.map(a=>a.slice(0,3)+' '+x.a[a]).join(' · ')+'</div></div>';el.innerHTML='<div class="scene-caption">CIVILIZAÇÕES</div>'+city(current,S.turn,false)+'<div class="mini-cities">'+S.players.map((x,i)=>i===S.turn?'':city(x,i,true)).join('')+'</div><div class="scene-note">Representações provisórias · Artes evolutivas serão adicionadas depois</div>'} function choose(k){if(S.kind&&S.kind!==k)return;S.kind=k;render()}function renderPurchase(){let x=p(),el=$('purchase');if(!S.kind){el.innerHTML='<p class="muted">Escolha cartas OU níveis.</p>';return}if(S.kind==='cards'){el.innerHTML='<p>Compras restantes: '+S.remaining+' · Espaços na mão: '+(limit(x)-x.hand.length)+'</p><button class="green" onclick="buyCard()" '+(!S.remaining||x.coins<1||x.hand.length>=limit(x)||(!S.deck.length&&!S.discard.length)?'disabled':'')+'>Comprar carta · 1 🪙</button>';return}el.innerHTML='<p>Compras restantes: '+S.remaining+'</p>'+aspects.map(a=>{let c=x.a[a]>=10?5:2;return '<button onclick="buyLevel(\''+a+'\')" '+(!S.remaining||x.a[a]>=12||x.coins<c?'disabled':'')+'>'+a+' +1 · '+c+' 🪙</button> '}).join('')}function rollDice(){if(S.winner||S.phase==='buy'||S.rolls>=3)return;let x=p();if(S.rolls){if(x.coins<4)return;x.coins-=4}S.rolls++;S.phase='buy';S.kind='';S.result=1+rand(dice(x));S.remaining=S.result;msg(x.name+' lançou D'+dice(x)+': '+S.result);render()}function buyCard(){let x=p();if(S.phase!=='buy'||S.kind!=='cards'||!S.remaining||x.coins<1||x.hand.length>=limit(x))return;let c=draw();if(c===null)return;x.hand.push(c);x.coins--;S.remaining--;msg(x.name+' comprou uma carta.');render()}function buyLevel(a){let x=p(),c=x.a[a]>=10?5:2;if(S.phase!=='buy'||S.kind!=='levels'||!S.remaining||x.a[a]>=12||x.coins<c)return;x.coins-=c;x.a[a]++;S.remaining--;msg(x.name+' elevou '+a+' para '+x.a[a]);render()}function finishBuy(){if(S.phase!=='buy')return;S.phase='after';render()}function endTurn(){if(S.winner||S.phase==='buy')return;let old=p();msg(old.name+' encerrou o turno.');S.turn=(S.turn+1)%S.players.length;if(!S.turn)S.round++;let x=p();S.agreements??=[];S.agreements=S.agreements.filter(a=>{if(a.acceptor!==S.turn)return true;if(a.remaining===0){msg('Acordo entre '+S.players[a.proposer].name+' e '+S.players[a.acceptor].name+' terminou.');return false}a.remaining--;return true});S.attackedThisTurn=[];x.shield=false;x.dom=false;x.trade=false;x.coins+=income(x);S.phase='pre';S.rolls=0;S.kind='';S.remaining=0;msg('Vez de '+x.name+' (+'+income(x)+' moeda(s)).');render();modal('Passe o celular','<p>Agora é a vez de <b>'+esc(x.name)+'</b>. Entregue o aparelho para manter as cartas secretas.</p><button class="green" onclick="closeModal()">Estou pronto</button>')}function showCard(i){let x=p(),id=x.hand[i],d=defs[id];modal(d[0],'<img class="full-card" src="'+actionImage(id)+'" alt="'+esc(d[0])+'"><p>'+d[2]+'</p><p class="muted">'+(S.phase==='pre'?'Pode usar antes do dado.':'Só pode usar cartas antes do primeiro dado.')+'</p><button class="green" '+(S.phase!=='pre'||!!S.winner?'disabled':'')+' onclick="useCard('+i+')">Usar carta</button>')}function isBound(i,j){return (S.agreements||[]).some(a=>a.remaining>=0&&((a.proposer===i&&a.acceptor===j)||(a.proposer===j&&a.acceptor===i)))}function canAttack(i){return i!==S.turn&&!S.players[i].shield&&!isBound(S.turn,i)}function markAttack(i){S.attackedThisTurn??=[];if(!S.attackedThisTurn.includes(i))S.attackedThisTurn.push(i)}function agreementsFor(i){return (S.agreements||[]).filter(a=>a.proposer===i||a.acceptor===i)}function agreementsText(i){let a=agreementsFor(i);return a.length?a.map(v=>'🤝 '+esc(S.players[v.proposer===i?v.acceptor:v.proposer].name)+' (até o início do '+(v.remaining===2?'3º':'próximo')+' turno de '+esc(S.players[v.acceptor].name)+')').join('<br>'):'Nenhum acordo ativo.'}function targets(){return S.players.map((x,i)=>({x,i})).filter(z=>z.i!==S.turn)}function chooseTarget(cb,filter=()=>true){let t=targets().filter(z=>filter(z.x));if(!t.length){modal('Sem alvo','<p>Nenhum adversário elegível.</p>');return}modal('Escolha o adversário',t.map(z=>'<div class="item"><button onclick="'+cb+'('+z.i+')">'+esc(z.x.name)+'</button> · Armamento '+z.x.a.Armamento+(z.x.shield?' 🛡️ protegido':'')+(isBound(S.turn,z.i)?' 🤝 acordo ativo':'')+'</div>').join(''))}function useCard(i){let x=p();if(S.phase!=='pre'||x.hand[i]===undefined)return;let id=x.hand[i],type=defs[id][3];if(type==='dominate'){closeModal();chooseTarget('cardDom',y=>canAttack(S.players.indexOf(y))&&x.a.Armamento>=y.a.Armamento+2);S.pending=i;return}if(type==='cardsteal'){closeModal();chooseTarget('cardTarget',y=>canAttack(S.players.indexOf(y))&&y.hand.length>0);S.pending=i;return}if(['steal','crisis','techdown','armdown','wisdown','ecodown'].includes(type)){closeModal();chooseTarget('attackTarget',y=>canAttack(S.players.indexOf(y)));S.pending=i;return}x.hand.splice(i,1);discard(id);if(type==='shield'){x.shield=true;msg(x.name+' ativou proteção.')}if(type==='invest'){x.coins+=3;msg(x.name+' recebeu 3 moedas.')}if(type==='tax'){let n=0;targets().forEach(z=>{if(canAttack(z.i)&&z.x.coins){z.x.coins--;x.coins++;markAttack(z.i);n++}});msg(x.name+' cobrou '+n+' moeda(s) de imposto.')}let a={techup:'Tecnologia',armup:'Armamento',wisup:'Sabedoria',ecoup:'Economia'}[type];if(a){x.a[a]=Math.min(12,x.a[a]+1);msg(x.name+' evoluiu '+a)}closeModal();render()}function consumePending(){let i=S.pending,id=p().hand[i];if(S.phase!=='pre'||id===undefined)return false;p().hand.splice(i,1);discard(id);S.pending=null;return true}function trim(x){while(x.hand.length>limit(x))discard(x.hand.pop())}function attackTarget(i){let y=S.players[i],type=defs[p().hand[S.pending]][3];if(!canAttack(i))return;if(!consumePending())return;markAttack(i);let n=0;if(type==='steal'){n=Math.min(2,y.coins);y.coins-=n;p().coins+=n}else if(type==='crisis'){n=Math.min(3,y.coins);y.coins-=n}else{let a={techdown:'Tecnologia',armdown:'Armamento',wisdown:'Sabedoria',ecodown:'Economia'}[type];n=Math.min(1,y.a[a]);y.a[a]-=n;if(a==='Sabedoria')trim(y)}msg(p().name+' usou '+type+' contra '+y.name+'.');closeModal();render()}function cardTarget(i){let y=S.players[i];if(!canAttack(i)||!y.hand.length)return;S.target=i;modal('Escolha uma carta de '+esc(y.name),'<p>As cartas estão viradas para baixo. Escolha uma posição:</p><div class="row">'+shuffle(y.hand.map((_,j)=>j)).map(j=>'<button class="back" onclick="takeCard('+j+')">🂠</button>').join('')+'</div>')}function takeCard(j){let y=S.players[S.target];if(!y||y.hand[j]===undefined||!canAttack(S.target))return;if(!consumePending())return;markAttack(S.target);let c=y.hand.splice(j,1)[0];p().hand.push(c);msg(p().name+' roubou uma carta de '+y.name);closeModal();render();modal('Carta obtida','<img class="full-card" src="'+actionImage(c)+'" alt="'+esc(defs[c][0])+'"><p>'+esc(defs[c][2])+'</p>')}function cardDom(i){if(!canAttack(i)||p().a.Armamento<S.players[i].a.Armamento+2)return;if(!consumePending())return;resolveDom(i)}function resolveDom(i){let y=S.players[i],x=p();if(!canAttack(i)||x.a.Armamento<y.a.Armamento+2)return;markAttack(i);S.target=i;modal('Domínio sobre '+esc(y.name),'<p>Escolha uma recompensa:</p><div class="row"><button onclick="domReward(\'coins\')">Até 5 moedas</button><button onclick="domReward(\'levels\')">Até 2 níveis</button><button onclick="domReward(\'cards\')">Até 2 cartas</button></div>')}function domReward(k){let x=p(),y=S.players[S.target];if(k==='coins'){let n=Math.min(5,y.coins);y.coins-=n;x.coins+=n}else if(k==='cards'){let n=Math.min(2,y.hand.length,limit(x)-x.hand.length);for(let j=0;j<n;j++)x.hand.push(y.hand.splice(rand(y.hand.length),1)[0])}else{modal('Reduzir até 2 níveis','<p>Escolha os aspectos do alvo:</p><div id="dlevels"></div><button onclick="closeModal();render()">Concluir</button>');S.domLeft=2;domLevels();x.dom=true;msg(x.name+' dominou '+y.name);render();return}x.dom=true;msg(x.name+' dominou '+y.name);closeModal();render()}function domLevels(){let y=S.players[S.target];$('dlevels').innerHTML='Restantes: '+S.domLeft+'<div class="row">'+aspects.map(a=>'<button '+(!S.domLeft||!y.a[a]?'disabled':'')+' onclick="domDown(\''+a+'\')">'+a+' ('+y.a[a]+')</button>').join('')+'</div>'}function domDown(a){let y=S.players[S.target];if(!S.domLeft||!y.a[a])return;y.a[a]--;S.domLeft--;if(a==='Sabedoria')trim(y);domLevels();save()}function objectives(){let x=p();modal('Meus objetivos · '+x.done.length+'/2',x.obj.map((id,j)=>{let o=raw[id],ok=Object.entries(o[2]).every(([a,n])=>x.a[a]>=n)&&x.coins>=o[3]&&(!o[4]||o[4]==='dom'&&x.dom||o[4]==='trade'&&x.trade);return '<div class="item objective-item"><img class="objective-art" src="'+objectiveImage(id)+'" alt="'+esc(o[0])+'"><div><b>'+esc(o[0])+'</b> · '+o[1]+' '+(x.done.includes(id)?'✅ CONCLUÍDO':'')+'<p>'+Object.entries(o[2]).map(([a,n])=>a+': '+x.a[a]+'/'+n).join(' · ')+' · Custo: '+o[3]+' moedas</p>'+(o[4]==='dom'?'<p>Dominar civilização com Armamento ao menos 2 níveis inferior, durante este turno.</p>':o[4]==='trade'?'<p>Firmar um acordo diplomático aceito por outro jogador neste turno.</p>':'')+(!x.done.includes(id)?'<button class="green" '+(!ok||!!S.winner?'disabled':'')+' onclick="claim('+id+')">Declarar objetivo</button>':'')+'</div>'}).join('')+'<p class="muted">Objetivos concluídos são permanentes; níveis não são consumidos.</p>')}function claim(id){let x=p(),o=raw[id];if(x.done.includes(id)||x.coins<o[3]||!Object.entries(o[2]).every(([a,n])=>x.a[a]>=n)||(o[4]==='dom'&&!x.dom)||(o[4]==='trade'&&!x.trade))return;x.coins-=o[3];x.done.push(id);msg(x.name+' concluiu '+o[0]);if(x.done.length===2){S.winner=x.name;msg('🏆 '+x.name+' venceu!')}render();objectives()}function opponents(){modal('Civilizações adversárias e acordos','<div class="item"><b>Meus acordos</b><p>'+agreementsText(S.turn)+'</p><p class="muted">O acordo impede ataques nos dois sentidos, inclusive no turno em que foi aceito.</p></div>'+targets().map(z=>'<div class="item"><b>'+esc(z.x.name)+'</b> '+(z.x.shield?'🛡️':'')+(isBound(S.turn,z.i)?' 🤝':'')+' · 🪙 '+z.x.coins+' · Objetivos '+z.x.done.length+'/2<p>'+aspects.map(a=>a+' '+z.x.a[a]).join(' · ')+'</p><p>Cartas na mão: '+z.x.hand.length+' (ocultas)</p><button '+(S.winner||S.phase==='buy'||p().coins<1||isBound(S.turn,z.i)||(S.attackedThisTurn||[]).includes(z.i)?'disabled':'')+' onclick="trade('+z.i+')">🤝 Propor acordo · 1 moeda</button>'+(isBound(S.turn,z.i)?'<p class="muted">Acordo ativo: ataques bloqueados nos dois sentidos.</p>':(S.attackedThisTurn||[]).includes(z.i)?'<p class="muted">Você já atacou este adversário neste turno.</p>':'')+'</div>').join(''))}function trade(i){let y=S.players[i],x=p();if(!y||i===S.turn||S.winner)return;if(S.phase==='buy')return modal('Aguarde','<p>Encerre as compras antes de propor um acordo.</p>');if(isBound(S.turn,i))return modal('Acordo ativo','<p>Vocês já possuem um acordo.</p>');if((S.attackedThisTurn||[]).includes(i))return modal('Proposta indisponível','<p>Você já atacou '+esc(y.name)+' neste turno e não pode propor um acordo a este jogador agora.</p>');if(x.coins<1)return modal('Moedas insuficientes','<p>Você precisa de 1 moeda para fazer a proposta.</p>');modal('Acordo diplomático com '+esc(y.name),'<p>Você pagará <b>1 moeda imediatamente</b>, mesmo que '+esc(y.name)+' recuse. Se aceitar, '+esc(y.name)+' receberá a moeda e ambos ficarão impedidos de atacar um ao outro durante duas rodadas.</p><p class="muted">O acordo também impede ataques de quem propõe no turno atual.</p><button class="green" onclick="offerTrade('+i+')">Pagar 1 moeda e propor</button> <button onclick="closeModal()">Cancelar sem pagar</button>')}function offerTrade(i){let y=S.players[i],x=p();if(!y||i===S.turn||S.winner||S.phase==='buy'||x.coins<1||isBound(S.turn,i)||(S.attackedThisTurn||[]).includes(i))return;x.coins--;S.pendingAgreement={proposer:S.turn,acceptor:i};msg(x.name+' pagou 1 moeda para propor acordo a '+y.name+'.');save();modal('Proposta de acordo para '+esc(y.name),'<p>Entregue o aparelho a <b>'+esc(y.name)+'</b> para responder.</p><p>Se aceitar, você receberá 1 moeda e ambos ficarão impedidos de atacar um ao outro durante duas rodadas. Se recusar, a moeda paga não será devolvida ao proponente.</p><button class="green" onclick="answerAgreement(true)">Aceitar acordo</button> <button onclick="answerAgreement(false)">Recusar acordo</button>')}function answerAgreement(accept){let a=S.pendingAgreement;if(!a)return;let x=S.players[a.proposer],y=S.players[a.acceptor];if(accept){y.coins++;S.agreements??=[];S.agreements.push({...a,remaining:2});x.trade=true;msg(y.name+' aceitou acordo com '+x.name+' e recebeu 1 moeda. Ataques bloqueados nos dois sentidos.')}else{msg(y.name+' recusou acordo com '+x.name+'. A moeda paga não foi devolvida.')}S.pendingAgreement=null;closeModal();render()}function rules(){modal('Resumo das regras','<div class="item">2 a 6 jogadores. Cada um começa com 3 moedas, 1 carta de ação e 2 objetivos secretos de categorias diferentes. Conclua ambos para vencer. Declare durante seu turno e pague o custo; conquistas são permanentes.</div><div class="item">Início do turno: renda de Economia (0–5: 1; 6–10: 2; 11–12: 3). Use cartas ANTES do primeiro dado. Tecnologia 0–5: D4; 6–10: D5; 11–12: D6.</div><div class="item">Cada dado permite até o resultado em compras, escolhendo APENAS cartas (1 moeda cada, aleatórias) OU níveis (2 moedas até nível 10; 5 moedas nos níveis 11 e 12). Até 2 dados adicionais por turno, 4 moedas cada.</div><div class="item">Sabedoria 0–5: até 3 cartas; 6–10: 4; 11–12: 5. Se Sabedoria cair, descarte imediatamente as excedentes. Cartas compradas só podem ser usadas em turno posterior.</div><div class="item">Domínio: permitido com carta própria ou objetivo ativo; exige Armamento 2 níveis acima do alvo. Escolha até 5 moedas, até 2 níveis reduzidos ou até 2 cartas do alvo. Proteção bloqueia ações hostis e qualquer domínio até o próximo turno do protegido.</div><div class="item">Cartas utilizadas e descartadas por redução de Sabedoria vão para a pilha de descarte; quando o baralho principal acabar, a pilha será embaralhada para formar um novo baralho. Acordos diplomáticos: proponha por 1 moeda (paga mesmo se houver recusa). Se aceito, o adversário recebe a moeda e ambos ficam impedidos de atacar um ao outro durante duas rodadas. Quem atacou um adversário no turno atual não pode propor acordo a ele nesse turno. Um acordo aceito também bloqueia ataques do proponente no turno atual. A mão dos adversários é secreta. Esta versão é uma demonstração local, sem salas online.</div>')}let saved=localStorage.getItem('mabelis-civilizacao-demo')||localStorage.getItem('novo-mundo-demo');try{if(saved){S=JSON.parse(saved);S.agreements??=[];S.attackedThisTurn??=[];if(S.pendingAgreement){S.pendingAgreement=null;msg('Proposta interrompida ao recarregar: a moeda paga não foi devolvida.')}render()}else setup()}catch(e){localStorage.removeItem('novo-mundo-demo');setup()}
</script></body></html>
